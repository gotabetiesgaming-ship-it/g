<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BasketBros Loader</title>
<base href="https://cdn.jsdelivr.net/gh/wnasmile/LAMAR@main/basketbros-io/">
<style>
html,body{margin:0;width:100%;height:100%;background:#090e1a;color:#fff;font:16px system-ui,Arial;overflow:hidden}
#openfl-content{position:absolute;inset:0;width:100%;height:100%;outline:none}
#loader{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:#090e1a}
.panel{text-align:center;max-width:440px;padding:30px}.panel h1{font-size:28px;margin:0 0 12px}.panel p{color:#bac7db;line-height:1.5}button{border:0;border-radius:8px;padding:12px 22px;background:#4a8dff;color:white;font-weight:700;cursor:pointer}#error{display:none;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;color:#ffb5b5;margin:16px 0}#retry{display:none}
</style>
</head>
<body>
<div id="openfl-content" tabindex="0"></div>
<div id="loader"><div class="panel"><h1>BasketBros</h1><p id="status">Loading game engine…</p><p id="error"></p><button id="retry" type="button">Retry</button></div></div>
<script>
// Compatibility callbacks expected by the BasketBros game engine.
// They do not request or display advertisements.
for (let n = 1; n <= 7; n++) window['ShowAd' + n] = function() {};
window.ShowAdBreak = function() { if (window.Main && typeof Main.DoneInterstitialAd === 'function') Main.DoneInterstitialAd(true); };
window.ShowVideo = function() { if (window.Main && typeof Main.DoneVideoAd === 'function') Main.DoneVideoAd(true); };
window.SendEvent = function() {};
window.updateStatus = function() {};
(function(){
  const status=document.getElementById('status');
  const error=document.getElementById('error');
  const retry=document.getElementById('retry');
  const loader=document.getElementById('loader');
  let started=false;
  function fail(message){status.textContent='Unable to start game';error.textContent=message;error.style.display='block';retry.style.display='inline-block';}
  function boot(){
    if(started)return;
    if(!window.lime || typeof window.lime.embed!=='function'){fail('BasketBros.js loaded, but lime.embed was not available.');return;}
    started=true;
    status.textContent='Starting game…';
    try{window.lime.embed('BasketBros','openfl-content',0,0,{parameters:{}});setTimeout(()=>{loader.style.display='none';document.getElementById('openfl-content').focus();},1800);}
    catch(e){started=false;fail(String(e));}
  }
  retry.onclick=()=>location.reload();
  window.addEventListener('error',e=>{
    if(!started){fail('JavaScript error: '+(e.message||'Unknown error'));}
    else if(e.message && e.message.includes('unlocked')){fail('Game engine error: '+e.message+'\nThe game itself is trying to access a missing object. This may require fixing BasketBros.js or its game data.');loader.style.display='flex';}
  });
  const script=document.createElement('script');
  script.src=new URL('BasketBros.js?th=448',document.baseURI).href;
  script.onload=boot;
  script.onerror=()=>fail('Could not load '+script.src);
  document.head.appendChild(script);
  setTimeout(()=>{if(!started && error.style.display!=='block')fail('The game script did not finish initializing. Check the Network and Console tabs.');},20000);
})();
</script>
</body>
</html>
