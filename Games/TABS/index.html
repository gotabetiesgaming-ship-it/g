<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<base href="https://cdn.jsdelivr.net/gh/web-ports/tabs@main/">
<title>TABS — Streaming Loader</title>
<style>html,body{margin:0;width:100%;height:100%;background:#090b12;color:white;font-family:system-ui}#gameContainer{width:100vw;height:100vh}#gameContainer canvas{width:100%!important;height:100%!important}#status{position:fixed;z-index:2;inset:0;display:grid;place-items:center;text-align:center;background:#090b12;padding:20px;box-sizing:border-box}#message{max-width:600px}small{color:#aab4c8}#bar{height:8px;background:#293346;border-radius:9px;margin:18px 0;overflow:hidden}#fill{height:100%;width:0;background:#70a7ff;transition:width .2s}</style>
</head>
<body>
<div id="status"><div id="message"><h1>TABS</h1><p id="detail">Loading Unity engine…</p><div id="bar"><div id="fill"></div></div><small id="hint">This port downloads about 1.75 GB of game assets on first launch. Keep this tab open.</small></div></div>
<div id="gameContainer"></div>
<script src="Build/UnityLoader.js"></script>
<script>
(()=>{
 const detail=document.getElementById('detail'), fill=document.getElementById('fill'), hint=document.getElementById('hint');
 const expected=1746*1024*1024; let loaded=0;
 function progress(){detail.textContent=`Downloading game assets: ${(loaded/1048576).toFixed(1)} MB / ~1746 MB`;fill.style.width=Math.min(100,loaded/expected*100)+'%';}
 async function fetchPart(url){const res=await fetch(url);if(!res.ok)throw new Error(`${url}: HTTP ${res.status}`);if(!res.body) {const buf=await res.arrayBuffer();loaded+=buf.byteLength;progress();return buf;}
 const reader=res.body.getReader(),chunks=[];let length=0;
 while(true){const {done,value}=await reader.read();if(done)break;chunks.push(value);length+=value.length;loaded+=value.length;progress();}
 const merged=new Uint8Array(length);let pos=0;for(const chunk of chunks){merged.set(chunk,pos);pos+=chunk.length;}return merged.buffer;}
 async function merge(file,count,key){const cache=await caches.open('tabs-stream-v1');const hit=await cache.match(key);if(hit)return URL.createObjectURL(await hit.blob());
 const parts=[];for(let i=1;i<=count;i++)parts.push(`${file}.part${i}`);
 // Sequential downloads reduce peak memory pressure compared with downloading all 89 parts simultaneously.
 const buffers=[];for(const part of parts)buffers.push(await fetchPart(part));
 const blob=new Blob(buffers);try{await cache.put(key,new Response(blob));}catch(e){console.warn('Caching unavailable:',e)}return URL.createObjectURL(blob);}
 async function start(){try{
 if(typeof UnityLoader==='undefined')throw new Error('UnityLoader.js could not be loaded from the CDN.');
 const data=await merge('Build/tabs.data.unityweb',86,'tabs.data.unityweb');
 const wasm=await merge('Build/tabs.wasm.code.unityweb',3,'tabs.wasm.code.unityweb');
 const original=XMLHttpRequest.prototype.open;
 XMLHttpRequest.prototype.open=function(method,url,...args){const u=String(url);if(u.includes('tabs.data.unityweb'))url=data;else if(u.includes('tabs.wasm.code.unityweb'))url=wasm;return original.call(this,method,url,...args)};
 detail.textContent='Starting TABS…';document.getElementById('status').style.display='none';
 UnityLoader.instantiate('gameContainer','Build/tabs.json');
 }catch(e){console.error(e);detail.textContent='Unable to load TABS';hint.textContent=String(e.message||e)+' — Check DevTools Network for blocked or missing CDN assets.';fill.style.width='0';}}
 start();
})();
</script>
</body></html>
